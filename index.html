<main id="view"></main><button class="fab" id="fab" data-act="sheet" data-k="pago"><i><span class="material-symbols-outlined">add</span></i>Registrar nuevo pago<span class="material-symbols-outlined" style="margin-left:auto">expand_less</span></button>
<div class="fab2" id="fab2"><button class="mn" data-act="qa" data-t="expense"><span class="material-symbols-outlined">remove</span>Gasto</button><button class="pl" data-act="qa" data-t="income"><span class="material-symbols-outlined">add</span>Ingreso</button></div>

<script>
/* ===== DATOS (capa intercambiable: fase 2 → GoogleSheetsService) ===== */
const DEFAULT_CATS = () => [['Comida','restaurant','#e8590c'],['Mercado','shopping_cart','#2f9e44'],['Transporte','directions_bus','#1c7ed6'],['Salud','favorite','#e03131'],['Hogar','home','#7048e8'],['Ocio','sports_esports','#f08c00'],['Ropa','checkroom','#d6336c'],['Otros','more_horiz','#868e96']].map(([name, icon, color], i) => ({ id: 'c' + (i + 1), name, icon, color }));
const DEFAULT_STATE = () => ({ updatedAt: 0, categories: DEFAULT_CATS(), transactions: [], balance: 0, income: { amount: 0, weekday: 5 }, templates: [], payments: [] });
const LocalStorageService = {
  KEY: 'finanzas-v1',
  async load() { try { const r = localStorage.getItem(this.KEY); if (r) return { ...DEFAULT_STATE(), ...JSON.parse(r) }; } catch (e) { console.warn(e); } return DEFAULT_STATE(); },
  async save(s) { try { localStorage.setItem(this.KEY, JSON.stringify(s)); } catch (e) { console.warn(e); } }
};
/* Sincronización opcional con Google Sheets (ver Code.gs). El dispositivo siempre guarda también en local. */
const SyncConfig = {
  get() { try { return JSON.parse(localStorage.getItem('alcanza-sync')); } catch { return null; } },
  set(c) { try { localStorage.setItem('alcanza-sync', JSON.stringify(c)); } catch {} },
  clear() { try { localStorage.removeItem('alcanza-sync'); } catch {} }
};
const GoogleSheetsService = {
  async call(action, state) {
    const c = SyncConfig.get(); let j;
    const r = await fetch(c.url, { method: 'POST', body: JSON.stringify({ token: c.token, action, state }) }); // texto plano: sin preflight CORS
    try { j = await r.json(); } catch { throw new Error('Respuesta inválida: revisa que el acceso de la implementación sea "Cualquier usuario"'); }
    if (!j.ok) throw new Error(j.error || 'Error desconocido'); return j.state;
  },
  pull() { return this.call('load'); }, push(s) { return this.call('save', s); }
};
const DataService = {
  onStatus: null,
  mark(ok, e) { const c = SyncConfig.get(); if (!c) return; if (ok) { c.lastSync = Date.now(); delete c.lastError; } else c.lastError = e.message || String(e); SyncConfig.set(c); this.onStatus && this.onStatus(); },
  queue(s) { if (!SyncConfig.get()) return; clearTimeout(this.t); this.t = setTimeout(async () => { this.t = null; try { await GoogleSheetsService.push(s); this.mark(true); } catch (e) { this.mark(false, e); } }, 700); },
  async load() {
    const local = await LocalStorageService.load(); if (!SyncConfig.get()) return local;
    try { const r = await GoogleSheetsService.pull(); this.mark(true);
      if (r && (r.updatedAt || 0) > (local.updatedAt || 0)) { await LocalStorageService.save(r); return { ...DEFAULT_STATE(), ...r }; }
      if ((local.updatedAt || 0) > ((r && r.updatedAt) || 0)) this.queue(local);
    } catch (e) { this.mark(false, e); } return local;
  },
  async pullIfNewer(s) { if (!SyncConfig.get() || this.t) return null;
    try { const r = await GoogleSheetsService.pull(); this.mark(true);
      if (r && (r.updatedAt || 0) > (s.updatedAt || 0)) { await LocalStorageService.save(r); return { ...DEFAULT_STATE(), ...r }; }
    } catch (e) { this.mark(false, e); } return null; },
  async save(s) { s.updatedAt = Date.now(); await LocalStorageService.save(s); this.queue(s); }
};

/* ===== LÓGICA ===== */
const DAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const add = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const ym = d => iso(d).slice(0, 7);
const daysTo = s => Math.round((parse(s) - today()) / 864e5);
const sum = a => a.reduce((t, p) => t + p.amount, 0);
const uid = () => Math.random().toString(36).slice(2, 9);
const money = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('es-CO');
const dlabel = s => { const d = parse(s); return `${cap(DAYS[d.getDay()])} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };
const dshort = s => { const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };
const clampDay = (y, m, day) => new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()));
function ensureMonths(S) { // crea el pago del mes actual y del siguiente para cada fijo activo
  const t = today();
  for (let off = 0; off < 2; off++) {
    const m = new Date(t.getFullYear(), t.getMonth() + off, 1), key = ym(m);
    S.templates.filter(x => x.active && key >= x.startMonth).forEach(x => {
      if (S.payments.some(p => p.templateId === x.id && p.month === key)) return;
      S.payments.push({ id: uid(), templateId: x.id, name: x.name, amount: x.amount, month: key, due: iso(clampDay(m.getFullYear(), m.getMonth(), x.day)), status: 'pending', paidAt: null });
    });
  }
}
function nextIncome() { for (let i = 1; i <= 7; i++) { const d = add(today(), i); if (d.getDay() === S.income.weekday) return d; } }
const pending = () => S.payments.filter(p => p.status === 'pending').sort((a, b) => a.due.localeCompare(b.due));
const iconFor = n => { n = n.toLowerCase(); const m = [[/internet|wifi|fibra/,'wifi'],[/arriendo|renta|alquiler|hipoteca|casa/,'home'],[/celular|móvil|movil|plan/,'smartphone'],[/multa|impuesto/,'warning'],[/gym|gimnasio/,'fitness_center'],[/luz|energ/,'bolt'],[/agua/,'water_drop'],[/netflix|spotify|stream/,'play_circle'],[/tarjeta|cr[eé]dito|deuda|cuota/,'credit_card']]; return (m.find(x => x[0].test(n)) || [0,'receipt_long'])[1]; };
const tone = s => { const c = chip(s)[0]; return c === 'late' || c === 'soon' ? c : ''; };
function chip(s) { const n = daysTo(s);
  if (n < 0) return ['late','error',`vencido hace ${-n} d`]; if (n <= 1) return ['soon','schedule', n ? 'vence mañana' : 'vence hoy'];
  if (n <= 7) return ['week','event',`vence el ${DAYS[parse(s).getDay()]}`]; return ['far','calendar_month',`en ${n} días`]; }

/* ===== INTERFAZ ===== */

}

  $('#view').innerHTML = VIEWS[tab]();
}
function openSheet(k) {
  const fijo = k === 'fijo';
  $('#sheet').innerHTML = `<div class="panel" role="dialog" aria-label="Nuevo pago"><div class="top" style="margin-bottom:12px"><h2>${fijo ? 'Añadir pago fijo' : 'Registrar nuevo pago'}</h2><button class="soft" data-act="close" aria-label="Cerrar">${ic('close')}</button></div>
    <form data-form="newpay"><label>Nombre<input name="name" required maxlength="40" autofocus></label><label>Monto<input name="amount" type="number" min="1" step="any" inputmode="decimal" required></label>
    <label>${fijo ? 'Primer vencimiento' : 'Fecha de vencimiento'}<input name="due" type="date" value="${iso(today())}" required></label>
    ${fijo ? '<input type="hidden" name="repeat" value="on">' : '<label class="chk"><input type="checkbox" name="repeat"> Se repite cada mes (pago fijo)</label>'}<button class="big-btn">${ic('check')}Guardar</button></form></div>`;
  $('#sheet').classList.add('open');
}
function updQA() { const e = qa.expr, v = evalExpr(e);
  $('#qdisp').textContent = e.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−') || '0'; $('#qres').textContent = e && isFinite(v) ? '= ' + money(v) : ''; }
function openQuick(type) {
  qa = { type, expr: '', cat: (S.categories[0] || {}).id || 'otros' }; const inc = type === 'income', ttl = inc ? 'Nuevo ingreso' : 'Nuevo gasto';
  $('#sheet').innerHTML = `<div class="panel" role="dialog" aria-label="${ttl}"><div class="top" style="margin-bottom:6px"><h2>${ttl}</h2><button class="soft" data-act="close" aria-label="Cerrar">${ic('close')}</button></div>
    <div class="qd" id="qdisp">0</div><div class="qs" id="qres"></div>
    ${inc ? '' : `<div class="cg" style="margin-top:10px">${S.categories.map(c => `<button type="button" class="qc ${c.id === qa.cat ? 'on' : ''}" data-act="qcat" data-id="${c.id}"><span class="ci" style="background:${c.color}">${ic(c.icon)}</span>${esc(c.name)}</button>`).join('')}</div>`}
    <div class="kp">${['7','8','9','/','4','5','6','*','1','2','3','-','.','0','bk','+'].map(k => `<button type="button" class="${'+-*/'.includes(k) ? 'op' : ''}" data-act="key" data-k="${k}" aria-label="${k === 'bk' ? 'Borrar' : k}">${k === 'bk' ? ic('backspace') : k === '/' ? '÷' : k === '*' ? '×' : k === '-' ? '−' : k === '.' ? ',' : k}</button>`).join('')}</div>
    <div style="display:flex;gap:10px"><input id="qnote" placeholder="Nota (opcional)" maxlength="40" style="flex:1"><input id="qdate" type="date" value="${iso(today())}" style="width:auto"></div>
    <button class="big-btn" style="margin-top:12px" data-act="qsave">${ic('check')}Guardar</button></div>`;
  $('#sheet').classList.add('open'); updQA();
}
const closeSheet = () => $('#sheet').classList.remove('open');
const byId = id => S.payments.find(p => p.id === id), tpl = id => S.templates.find(x => x.id === id);
const done = async msg => { await save(); if (msg) toast(msg); render(); };
const actions = {
  pay: d => { const p = byId(d.id); p.status = 'paid'; p.paidAt = iso(today()); S.balance -= p.amount; done('Pago registrado'); },
  undo: d => { const p = byId(d.id); p.status = 'pending'; p.paidAt = null; S.balance += p.amount; done('Pago deshecho'); },
  delpay: d => { if (confirm('¿Eliminar este pago?')) { S.payments = S.payments.filter(p => p.id !== d.id); done(); } },
  income: () => { S.balance += S.income.amount; S.transactions.push({ id: uid(), type: 'income', amount: S.income.amount, cat: 'ingreso', date: iso(today()), note: 'Ingreso semanal' }); done('Ingreso sumado al saldo'); },
  sheet: d => openSheet(d.k), close: closeSheet, hidesim: () => { sim = null; render(); },
  wd: d => { S.income.weekday = +d.i; const f = document.querySelector('[data-form=income] [name=amount]'); S.income.amount = parseFloat(f.value) || S.income.amount; render(); },
  tamount: d => { const x = tpl(d.id), v = parseFloat(prompt('Nuevo monto para ' + x.name, x.amount)); if (!(v > 0)) return; x.amount = v; S.payments.filter(p => p.templateId === x.id && p.status === 'pending').forEach(p => p.amount = v); done('Monto actualizado'); },
  ttoggle: d => { const x = tpl(d.id); x.active = !x.active; if (x.active) ensureMonths(S); done(); },
  tdel: d => { const x = tpl(d.id); if (!confirm(`¿Eliminar "${x.name}" y sus pagos pendientes? Los ya pagados se conservan.`)) return; S.templates = S.templates.filter(t => t !== x); S.payments = S.payments.filter(p => !(p.templateId === x.id && p.status === 'pending')); done(); },
  export: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' })); a.download = 'alcanza-' + iso(today()) + '.json'; a.click(); },
  qa: d => openQuick(d.t),
  qcat: d => { qa.cat = d.id; document.querySelectorAll('.qc').forEach(b => b.classList.toggle('on', b.dataset.id === d.id)); },
  key: d => { let e = qa.expr; const k = d.k;
    if (k === 'bk') e = e.slice(0, -1);
    else if ('+-*/'.includes(k)) { if (!e) return; e = /[+\-*/]$/.test(e) ? e.slice(0, -1) + k : e + k; }
    else if (k === '.') { const l = e.split(/[+\-*/]/).pop(); if (l.includes('.')) return; e += l ? '.' : '0.'; }
    else e += k;
    qa.expr = e.slice(0, 40); updQA(); },
  qsave: () => { const v = evalExpr(qa.expr); if (!(v > 0)) return toast('Ingresa un monto');
    const amount = Math.round(v * 100) / 100, inc = qa.type === 'income';
    S.transactions.push({ id: uid(), type: qa.type, amount, cat: inc ? 'ingreso' : qa.cat, date: $('#qdate').value || iso(today()), note: $('#qnote').value.trim() });
    S.balance += inc ? amount : -amount; closeSheet(); done(inc ? 'Ingreso registrado' : 'Gasto registrado'); },
  deltx: d => { const x = S.transactions.find(t => t.id === d.id); if (!confirm('¿Eliminar este movimiento? El saldo se ajustará.')) return;
    S.balance += x.type === 'income' ? -x.amount : x.amount; S.transactions = S.transactions.filter(t => t !== x); done(); },
  gper: d => { gp = d.p; goff = 0; render(); }, gnav: d => { goff = Math.min(0, goff + +d.n); render(); },
  catren: d => { const c = S.categories.find(x => x.id === d.id), n = prompt('Nuevo nombre', c.name); if (n && n.trim()) { c.name = n.trim(); done(); } },
  catdel: d => { const c = S.categories.find(x => x.id === d.id); if (confirm(`¿Eliminar la categoría "${c.name}"? Sus movimientos pasarán a "Otros".`)) { S.categories = S.categories.filter(x => x !== c); done(); } },
  rowtog: d => { openRow = openRow === d.id ? null : d.id; render(); },
  coltog: d => { collapsed[d.k] = !isCol(d.k, +d.n); render(); },
  syncoff: () => { SyncConfig.clear(); render(); toast('Desconectado'); },
  reset: () => { if (confirm('Se borrará todo' + (SyncConfig.get() ? ', también en tu hoja de Google' : '') + '. ¿Continuar?')) { S = DEFAULT_STATE(); done('Datos borrados'); } }
};
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { location.hash = g.dataset.go; return; }
  const b = e.target.closest('[data-act]'); if (b) actions[b.dataset.act](b.dataset); else if (e.target.id === 'sheet') closeSheet();
});
document.addEventListener('change', async e => { if (e.target.id !== 'imp') return;
  try { S = { ...DEFAULT_STATE(), ...JSON.parse(await e.target.files[0].text()) }; ensureMonths(S); done('Copia importada'); } catch { toast('Archivo no válido'); } });
document.addEventListener('submit', e => {
  e.preventDefault(); const v = Object.fromEntries(new FormData(e.target)), k = e.target.dataset.form;
  if (k === 'newpay') { const amount = parseFloat(v.amount), d = parse(v.due), name = v.name.trim(); closeSheet();
    if (v.repeat) { S.templates.push({ id: uid(), name, amount, day: d.getDate(), startMonth: ym(d), active: true }); ensureMonths(S); }
    else S.payments.push({ id: uid(), templateId: null, name, amount, month: ym(d), due: v.due, status: 'pending', paidAt: null });
    done('Pago agregado'); }
  else if (k === 'income') { S.income.amount = parseFloat(v.amount) || 0; done('Ingreso guardado'); }
  else if (k === 'newcat') { S.categories.push({ id: 'c' + uid(), name: v.name.trim(), icon: v.icon, color: v.color }); done('Categoría agregada'); }
  else if (k === 'sync') connect(v.url.trim(), v.token.trim());
  else if (k === 'balance') { S.balance = parseFloat(v.b) || 0; done('Saldo actualizado'); }
  else if (k === 'sim') { sim = { amount: parseFloat(v.amount), date: v.date < iso(today()) ? iso(today()) : v.date }; render(); }
});
window.addEventListener('hashchange', () => { tab = TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : 'pagos'; scrollTo(0, 0); render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('visibilitychange', async () => { if (document.hidden || !S) return;
  const r = await DataService.pullIfNewer(S); if (r) S = r;
  const n = S.payments.length; ensureMonths(S); if (S.payments.length !== n) await save(); render(); });
window.onerror = (m, u, l) => { $('#view').innerHTML = `<p style="color:#ba1a1a">Error: ${m} (línea ${l})</p>`; };
(async () => { S = await DataService.load(); const n0 = S.payments.length; ensureMonths(S); if (S.payments.length !== n0) await save();
  DataService.onStatus = () => { if (tab === 'ajustes' && !document.activeElement.matches('input')) render(); }; window.dispatchEvent(new Event('hashchange')); })();
</script></body></html>
